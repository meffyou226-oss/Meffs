name: Download BTCUSD M1

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start month YYYY-MM
        required: true
        default: "2022-01"
      end:
        description: End month YYYY-MM
        required: true
        default: "2026-08"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download monthly BTCUSD M1 CSVs from Dukascopy
        run: |
          chmod +x scripts/download_btcusd_m1.sh
          bash scripts/download_btcusd_m1.sh data/btcusd_m1 "${{ inputs.start }}" "${{ inputs.end }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/btcusd_m1
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Add BTCUSD M1 Dukascopy data ${{ inputs.start }} to ${{ inputs.end }}"
          git push
