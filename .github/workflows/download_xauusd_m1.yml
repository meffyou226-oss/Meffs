name: Download XAUUSD M1

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start month YYYY-MM
        required: true
        default: "2022-01"
      end:
        description: End month YYYY-MM
        required: true
        default: "2026-08"
      jobs:
        description: Parallel month downloads
        required: true
        default: "8"

concurrency:
  group: xauusd-m1-upload
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download months in parallel
        run: |
          python scripts/download_xauusd_m1.py \
            --out data/xauusd_m1 \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --jobs "${{ inputs.jobs }}"
      - name: Commit each month separately
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          shopt -s nullglob
          for f in data/xauusd_m1/XAUUSD_M1_*.csv; do
            git add "$f"
            if git diff --cached --quiet; then
              continue
            fi
            base=$(basename "$f" .csv)
            git commit -m "Add ${base} from Dukascopy"
            echo "committed $base"
          done
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo pushed
              exit 0
            fi
            sleep $((i * 3))
          done
          git push origin HEAD:main
